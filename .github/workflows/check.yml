name: check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://graildrop.vercel.app/api/state https://graildrop.vercel.app/api/tick https://degen-radio-live.vercel.app/ https://exitcall-two.vercel.app/ https://roasterr.vercel.app/; do
            c=$(curl -s -o body.txt -w "%{http_code}" --max-time 60 "$u"); echo "::notice title=$u::$c $(head -c 700 body.txt | tr -d '\n')"
          done
          curl -s --max-time 30 https://gacha.collectorcrypt.com/api/machines -o m.json
          echo "::notice title=machines::$(jq -c '[.machines[] | {c:.code,n:(.shortName//.name),p:.price,pub:.public,s:(.stock|tostring)}]' m.json | head -c 3800)"
