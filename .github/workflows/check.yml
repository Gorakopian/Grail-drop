name: check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s --max-time 30 https://gacha.collectorcrypt.com/api/machines -o m.json
          echo "::notice title=img1::$(jq -c '[.machines[] | select(.public) | {c:.code, i:.image, t:.thumbnailUrl, nb:.imageNobg}] | .[0:12]' m.json | head -c 3900)"
          echo "::notice title=img2::$(jq -c '[.machines[] | select(.public) | {c:.code, i:.image, t:.thumbnailUrl, nb:.imageNobg}] | .[12:24]' m.json | head -c 3900)"
          echo "::notice title=img3::$(jq -c '[.machines[] | select(.public) | {c:.code, i:.image, t:.thumbnailUrl, nb:.imageNobg}] | .[24:40]' m.json | head -c 3900)"
          for u in $(jq -r '[.machines[] | select(.public) | (.imageNobg // empty), (.image // empty)] | .[0:4][]' m.json); do echo "::notice title=size::$u $(curl -s -o x -w '%{http_code} %{content_type} %{size_download}' --max-time 20 "$u") $(python3 -c "import struct;d=open('x','rb').read(32);print(struct.unpack('>II',d[16:24]) if d[:4]==b'\x89PNG' else d[:4])")"; done
