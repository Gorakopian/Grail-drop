name: check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s --max-time 70 https://graildrop.vercel.app/api/tick -o t.json; echo "::notice title=tick::$(head -c 300 t.json)"
          curl -s --max-time 60 https://graildrop.vercel.app/api/state -o s.json
          echo "::notice title=imgs::$(jq -c '[.raffles[] | (.image // "none") | split("/") | .[-2:] | join("/")] | .[0:40]' s.json | head -c 3000)"
          u=$(jq -r '[.raffles[] | select(.image != null) | .image][0]' s.json)
          echo "::notice title=opt::$(curl -s -o x.webp -w '%{http_code} %{content_type} %{size_download}' --max-time 30 "https://graildrop.vercel.app/_vercel/image?url=$(jq -rn --arg u "$u" '$u|@uri')&w=384&q=80")"
