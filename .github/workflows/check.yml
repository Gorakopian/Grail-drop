name: check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s --max-time 30 "https://gacha.collectorcrypt.com/api/getRecentWinners" -o w.json
          echo "::notice title=winners::$(head -c 2500 w.json)"
          curl -s --max-time 30 https://gacha.collectorcrypt.com/api/machines -o m.json
          echo "::notice title=fields::$(jq -c '.machines[0] | del(.odds,.tierRanges,.stock) ' m.json | head -c 2500)"
